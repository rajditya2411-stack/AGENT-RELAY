<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>AgentRelay — Remote Agent Console</title>
  
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            canvas: '#F8FAFC', // Crisp, modern developer white/slate canvas
            card: '#FFFFFF',
            accent: {
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA',
            }
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.03)',
            'pill': '0 2px 10px -1px rgba(15, 23, 42, 0.08)',
            'input': '0 4px 24px -2px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 4px;
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-canvas text-slate-900 flex flex-col h-[100dvh] w-full font-sans overflow-hidden select-none antialiased">

  <!-- ================= TOP HEADER (Clean White / Frosted) ================= -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 z-30 shrink-0">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      
      <!-- Brand & Project Info -->
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-md shadow-slate-900/10">
          <span class="text-sm font-bold">⚡</span>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-sm font-bold tracking-tight text-slate-900">AgentRelay</h1>
            <span class="text-[10px] bg-slate-100 text-slate-600 font-mono font-medium px-1.5 py-0.5 rounded-full border border-slate-200/60">v1.0</span>
          </div>
          
          <!-- Subtitle Badges (Device + Repo) -->
          <div class="flex items-center gap-1.5 mt-0.5">
            <span id="device-pill" class="inline-flex items-center gap-1 text-[11px] font-mono font-medium text-slate-600">
              <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse-subtle"></span>
              <span id="device-name-display">PC-DESKTOP</span>
              <span id="status-text" class="text-slate-400 font-sans text-[10px]">(CONNECTING)</span>
            </span>
            <span class="text-slate-300">•</span>
            <span id="project-pill" class="inline-flex items-center gap-1 text-[11px] font-mono text-slate-500 bg-slate-100/80 px-1.5 py-0.5 rounded border border-slate-200/50">
              <span>📁</span>
              <span id="project-name-display">workspace [main*]</span>
            </span>
          </div>
        </div>
      </div>

      <!-- Settings Gear -->
      <button id="btn-settings" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200/70 border border-slate-200/80 flex items-center justify-center text-slate-600 hover:text-slate-900 transition active:scale-95 shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
      </button>

    </div>
  </header>

  <!-- ================= DEVICE OFFLINE ALERT BANNER ================= -->
  <div id="offline-banner" class="hidden bg-rose-50 border-b border-rose-200 px-4 py-2 text-xs text-rose-700 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-rose-500"></span>
      <span class="font-medium">DEVICE OFFLINE:</span>
      <span class="text-rose-600/90 text-[11px]">Desktop bridge is disconnected or asleep.</span>
    </div>
    <button id="btn-reconnect" class="bg-rose-600 hover:bg-rose-700 text-white font-medium px-2.5 py-0.5 rounded text-[11px] transition shadow-sm">
      Retry
    </button>
  </div>

  <!-- ================= CHAT MESSAGE FEED (Clean Light Canvas) ================= -->
  <main id="chat-feed" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-4 max-w-xl w-full mx-auto select-text">
    
    <!-- Welcome Hint -->
    <div class="bg-white border border-slate-200/80 rounded-2xl p-4 text-center text-slate-500 text-xs shadow-card space-y-1 my-2">
      <div class="text-xl mb-1">⚡ 📱 💻</div>
      <div class="font-semibold text-slate-800 text-sm">Welcome to AgentRelay</div>
      <p class="leading-relaxed text-slate-500">Type an instruction below to control and stream coding tasks from your local computer.</p>
    </div>

  </main>

  <!-- ================= RECOVERY QUICK-ACTIONS BAR ================= -->
  <div id="recovery-bar" class="px-4 py-2 max-w-xl w-full mx-auto flex items-center gap-2 overflow-x-auto custom-scrollbar shrink-0 z-20">
    <button id="btn-auto-audit" class="flex items-center gap-1.5 bg-white hover:bg-slate-50 text-indigo-700 border border-slate-200/90 shadow-pill text-xs font-semibold px-3 py-1.5 rounded-full transition active:scale-95 whitespace-nowrap">
      <span>🔍</span> Auto-Audit &amp; Resume
    </button>
    <button id="btn-undo-changes" class="flex items-center gap-1.5 bg-white hover:bg-slate-50 text-rose-600 border border-slate-200/90 shadow-pill text-xs font-semibold px-3 py-1.5 rounded-full transition active:scale-95 whitespace-nowrap">
      <span>↩️</span> Undo Changes
    </button>
    <button id="btn-clear-chat" class="flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-400 hover:text-slate-600 border border-slate-200/80 shadow-pill text-xs font-medium px-2.5 py-1.5 rounded-full transition active:scale-95 ml-auto whitespace-nowrap">
      <span>🗑️</span> Clear
    </button>
  </div>

  <!-- ================= BOTTOM FLOATING INPUT CONSOLE ================= -->
  <footer class="bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 py-3 shrink-0 z-30">
    <div class="max-w-xl mx-auto">
      <form id="prompt-form" class="relative flex items-center bg-slate-900 text-white rounded-full pl-4 pr-1.5 py-1.5 shadow-input border border-slate-800">
        
        <!-- Textarea / Input -->
        <input
          id="prompt-input"
          type="text"
          placeholder="Instruct agent on your computer..."
          autocomplete="off"
          class="flex-1 bg-transparent text-sm text-slate-100 placeholder-slate-400 focus:outline-none pr-2"
        />

        <!-- Action Group: Send & Emergency Stop -->
        <div class="flex items-center gap-1.5 shrink-0">
          <!-- Send Button -->
          <button
            type="submit"
            id="btn-send"
            class="w-8 h-8 rounded-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white flex items-center justify-center transition shadow-md shadow-indigo-500/30 disabled:opacity-40 disabled:pointer-events-none"
            title="Send Prompt"
          >
            <svg class="w-3.5 h-3.5 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path>
            </svg>
          </button>

          <!-- Emergency Stop Button -->
          <button
            type="button"
            id="btn-stop"
            class="w-8 h-8 rounded-full bg-slate-800 hover:bg-rose-600/80 text-slate-400 hover:text-white flex items-center justify-center transition active:scale-95"
            title="Emergency Stop"
          >
            <span class="w-2.5 h-2.5 rounded-sm bg-current"></span>
          </button>
        </div>

      </form>
    </div>
  </footer>

  <!-- ================= SETTINGS MODAL ================= -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl animate-in fade-in duration-200">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
          <span>⚙️</span> Device Settings
        </h3>
        <button id="btn-close-settings" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
      </div>
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">Device Identifier</label>
          <input id="input-device-id" type="text" value="my-pc" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">Pairing Secret Token</label>
          <input id="input-secret-token" type="password" value="default_secret" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
        <div>
          <label class="block text-slate-600 mb-1 font-semibold">Project / Repo Name</label>
          <input id="input-project-name" type="text" value="mindmap-backend [main*]" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button id="btn-save-settings" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-md shadow-indigo-600/20">
          Save &amp; Connect
        </button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
